name: Julkaise Simo Kotinaytto

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hae tiedostot
        uses: actions/checkout@v6
      - name: Valmistele GitHub Pages
        uses: actions/configure-pages@v6
      - name: Pakkaa sivu
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Julkaise sivu
        id: deployment
        uses: actions/deploy-pages@v5
